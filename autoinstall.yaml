#cloud-config
# autoinstall.yaml — generated bằng trình tạo, kiểm tra lại trước khi dùng thật
autoinstall:
  version: 1

  locale: en_US.UTF-8
  keyboard:
    layout: us

  network:
    network:
      version: 2
      ethernets:
        eth0:
          match:
            name: "e*"
          dhcp4: true
          dhcp-identifier: mac

  apt:
    geoip: true

  storage:
    layout:
      name: lvm

  identity:
    hostname: nqatech
    username: nqatech
    realname: "nqatech"
    password: "$6$z/AP10hELeQ.PT8E$sDzuw4jTf.c8rCc8vpgph5fYkMbDp.Jlh9W/TPV3TU3uOT/3QykM/70f3wWRe5p2zGaJkPO4AxisHxQx9sghl/"

  ssh:
    install-server: true
    allow-pw: true

  packages:
    - curl
    - git
    - vim
    - htop
    - ufw
    - fail2ban

  updates: security

  late-commands:
    - curtin in-target --target=/target -- timedatectl set-timezone Asia/Ho_Chi_Minh
    - curtin in-target --target=/target -- ufw allow OpenSSH
    - curtin in-target --target=/target -- ufw --force enable

  shutdown: reboot